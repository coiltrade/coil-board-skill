name: plugin
# Guards plugin/ (the Claude directory plugin). The directory tracks main with a push webhook, so every
# push to main becomes a candidate plugin version; a change without a raised "version" would not ship.
on:
  push:
    paths: ['plugin/**', '.github/workflows/plugin.yml', '.github/scripts/plugin-guard.sh']
  pull_request:
    paths: ['plugin/**', '.github/workflows/plugin.yml', '.github/scripts/plugin-guard.sh']
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # the PR head itself, not the synthetic merge commit, so the version checked is the PR's
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Manifest, files, skills, MCP url
        run: .github/scripts/plugin-guard.sh structure
      - name: Version raised when plugin/ changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/plugin-guard.sh version
      - name: Claude plugin validate
        # Pinned (2.1.309) so a new CLI release cannot turn this red alone; bump it deliberately. The directory's own checks (a subset). Verified to run non-interactively with no API key and an empty HOME.
        run: npx -y @anthropic-ai/claude-code@2.1.309 plugin validate ./plugin </dev/null
